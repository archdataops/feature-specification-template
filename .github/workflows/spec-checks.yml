name: Spec checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # ручной запуск: Actions → Spec checks → Run workflow

permissions:
  contents: read

concurrency:
  group: spec-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Проверки спецификации
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Трассируемость примера и сверка с OpenAPI
        run: python3 tools/check_traceability.py example --openapi api/openapi.yaml

      - name: Трассируемость пустого шаблона
        run: python3 tools/check_traceability.py template

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Линтер OpenAPI (Redocly)
        run: npx --yes @redocly/cli@1.25.11 lint api/openapi.yaml --config redocly.yaml

      - name: Синтаксис диаграмм PlantUML
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq graphviz > /dev/null
          curl -sSL -o plantuml.jar https://github.com/plantuml/plantuml/releases/download/v1.2024.7/plantuml-1.2024.7.jar
          java -jar plantuml.jar -checkonly -charset UTF-8 diagrams/*.puml diagrams/c4/*.puml

  pages:
    name: Публикация Swagger UI
    needs: checks
    # Публикуем только из main и только когда репозиторий публичный:
    # GitHub Pages для приватных репозиториев требует платный тариф.
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Собрать сайт
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          cp api/openapi.yaml _site/openapi.yaml

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
